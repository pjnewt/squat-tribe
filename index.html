<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Squat Tribe" />
  <title>Squat Tribe</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">⬟</div>
        <div>
          <h1>Squat Tribe</h1>
          <p>Adaptive Fatigue Protocol</p>
        </div>
      </div>
      <button id="installBtn" class="pill ghost">Install App</button>
    </header>

    <main id="screenRoot" class="screen-root"></main>

    <nav id="bottomNav" class="bottom-nav hidden">
      <button class="nav-btn" data-nav="home">Home</button>
      <button class="nav-btn" data-nav="history">History</button>
      <button class="nav-btn" data-nav="profile">Profile</button>
    </nav>
  </div>

  <template id="tpl-onboarding">
    <section class="screen onboarding-screen">
      <div class="card onboarding-card">
        <div class="hero-stat">Protocol Lab</div>
        <h2 id="obTitle"></h2>
        <p id="obBody"></p>
        <div class="button-row">
          <button id="obSkip" class="pill ghost">Skip intro</button>
          <button id="obNext" class="pill primary">Next</button>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-home">
    <section class="screen home-screen">
      <div class="card center-card">
        <div class="score-ring-wrap">
          <svg class="pentagon-svg" viewBox="0 0 300 300" aria-label="Pentagon protocol">
            <polygon
              points="150,25 270,110 225,250 75,250 30,110"
              class="pentagon-outline"
            ></polygon>
            <g id="pentagonVertices"></g>
            <text x="150" y="138" text-anchor="middle" class="avg-label">7-Day Avg DS</text>
            <text x="150" y="172" text-anchor="middle" class="avg-value" id="homeAvgDs">0.0</text>
          </svg>
        </div>
        <div class="today-block">
          <div class="muted-label">Today’s exercise</div>
          <div id="todayExerciseName" class="today-exercise-name"></div>
        </div>
        <div class="button-stack">
          <button id="startSessionBtn" class="pill primary">Start Session</button>
          <button id="installHomeBtn" class="pill secondary">Install App</button>
        </div>
      </div>

      <div class="card split-card">
        <div>
          <div class="muted-label">Mode</div>
          <div id="modeLabel" class="big-readout"></div>
        </div>
        <button id="toggleModeBtn" class="pill ghost small">Toggle Mode</button>
      </div>

      <div class="card install-card hidden" id="installHelpCard">
        <h3>Install</h3>
        <p id="installHelpText">
          On Chrome, tap the menu and choose “Add to Home screen” or “Install app”.
        </p>
      </div>

      <div class="card hidden" id="recoveryCard">
        <h3 class="danger-title">Recovery Mission</h3>
        <p>Your recent Density Score is low for 3 consecutive sessions. Prioritise mobility or isometrics today.</p>
      </div>
    </section>
  </template>

  <template id="tpl-profile">
    <section class="screen profile-screen">
      <div class="card">
        <h2>Profile</h2>
        <label class="field">
          <span>Bodyweight (kg)</span>
          <input id="profileBodyweight" type="number" min="20" max="300" step="0.1" />
        </label>

        <label class="field">
          <span>Preferred mode</span>
          <select id="profileMode">
            <option value="fixed">Fixed Pentagon</option>
            <option value="individual">Individual</option>
          </select>
        </label>

        <label class="field">
          <span>Rep detection sensitivity</span>
          <select id="profileSensitivity">
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </label>

        <button id="saveProfileBtn" class="pill primary">Save Profile</button>
      </div>
    </section>
  </template>

  <template id="tpl-history">
    <section class="screen history-screen">
      <div class="card">
        <h2>History</h2>
        <div id="historyList" class="history-list"></div>
      </div>
    </section>
  </template>

  <template id="tpl-setup">
    <section class="screen session-screen">
      <div class="card">
        <h2 id="setupExerciseTitle"></h2>
        <div id="exerciseImageWrap" class="exercise-image-wrap"></div>

        <label class="field">
          <span>External load (kg)</span>
          <input id="externalLoadInput" type="number" min="0" max="300" step="0.5" value="0" />
        </label>

        <div id="individualChooser" class="hidden">
          <label class="field">
            <span>Select exercise</span>
            <select id="exerciseChooser"></select>
          </label>
        </div>

        <div id="unilateralPromptWrap" class="hidden">
          <label class="field">
            <span>Select your weaker leg</span>
            <select id="weakerLegInput">
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </label>
        </div>

        <button id="beginExerciseBtn" class="pill primary">Begin</button>
      </div>
    </section>
  </template>

  <template id="tpl-active-set">
    <section class="screen active-screen">
      <div class="card active-card">
        <div class="muted-label" id="phaseLabel"></div>
        <h2 id="activeExerciseName"></h2>
        <div id="activeSubLabel" class="sub-label"></div>
        <div id="activeImageWrap" class="active-image-wrap"></div>

        <div class="live-grid">
          <div class="metric">
            <div class="metric-label">Timer</div>
            <div id="setTimer" class="metric-value mono">00:00</div>
          </div>
          <div class="metric">
            <div class="metric-label">Reps</div>
            <div id="repCounter" class="metric-value mono">0</div>
          </div>
        </div>

        <div class="sensor-note">Tracking reps… hold the phone in both hands and squat with steady rhythm.</div>

        <div class="button-row">
          <button id="startSetBtn" class="pill primary">Start</button>
          <button id="stopSetBtn" class="pill danger" disabled>Stop</button>
        </div>

        <div class="manual-adjust">
          <button id="minusRepBtn" class="pill ghost small">-</button>
          <span class="muted-label">Adjust reps if needed</span>
          <button id="plusRepBtn" class="pill ghost small">+</button>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-rest">
    <section class="screen rest-screen">
      <div class="card rest-card pulse-bg">
        <div class="muted-label" id="restPhaseLabel"></div>
        <h2 id="restExerciseName"></h2>
        <div class="rest-timer mono" id="restCountdown">15</div>
        <div id="myoTargetBanner" class="target-banner hidden"></div>
        <p id="restSubText"></p>
        <button id="endRestEarlyBtn" class="pill ghost">Skip Rest</button>
      </div>
    </section>
  </template>

  <template id="tpl-myo-ready">
    <section class="screen myo-ready-screen">
      <div class="card">
        <div class="muted-label">Myo Set</div>
        <h2 id="myoExerciseName"></h2>
        <div class="myo-target mono" id="myoTargetText"></div>
        <div class="fatigue-shell">
          <div id="fatigueBar" class="fatigue-bar"></div>
        </div>
        <p id="myoInstructions"></p>
        <div class="button-row">
          <button id="startMyoBtn" class="pill primary">Start Myo Set</button>
          <button id="finishSessionBtn" class="pill ghost">I’m Done</button>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-summary">
    <section class="screen summary-screen">
      <div class="card">
        <div class="muted-label">Session Complete</div>
        <h2 id="summaryTitle"></h2>
        <div id="summaryBody"></div>
        <button id="logSessionBtn" class="pill primary">Log Session</button>
      </div>
    </section>
  </template>

  <script src="./app.js"></script>
</body>
</html>
